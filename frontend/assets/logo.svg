<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer glowing rings -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#shieldGrad)" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.6" />
  <circle cx="50" cy="50" r="41" fill="none" stroke="url(#accentGrad)" stroke-width="0.8" opacity="0.4" />
  
  <!-- Main Emblem: Stylized shield / book -->
  <path d="M50 22 C62 22, 72 26, 72 38 C72 58, 56 74, 50 78 C44 74, 28 58, 28 38 C28 26, 38 22, 50 22 Z" 
        fill="url(#shieldGrad)" filter="url(#glow)" opacity="0.95" />
        
  <!-- Core Design: Graduation Cap + Payslip Shield -->
  <path d="M50 32 L68 40 L50 48 L32 40 Z" fill="#ffffff" />
  <path d="M40 45 L40 56 C40 60, 44 63, 50 63 C56 63, 60 60, 60 56 L60 45" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="62" y1="42" x2="62" y2="52" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="62" cy="52" r="1.8" fill="#ffffff" />
  
  <!-- Dollar Symbol inside a glowing badge -->
  <circle cx="50" cy="53" r="7" fill="#1e1b4b" stroke="url(#accentGrad)" stroke-width="1.5" />
  <text x="50" y="56" font-family="'Inter', sans-serif" font-weight="900" font-size="9" fill="#ffffff" text-anchor="middle">$</text>
</svg>
