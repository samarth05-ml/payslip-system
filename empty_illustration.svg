<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <defs>
    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer glowing rings -->
  <ellipse cx="100" cy="110" rx="60" ry="12" fill="none" stroke="url(#glowPurple)" stroke-dasharray="8 4" stroke-width="1.5" />
  <ellipse cx="100" cy="110" rx="45" ry="8" fill="rgba(99, 102, 241, 0.1)" />

  <!-- The Folder Outline -->
  <path d="M50 40 L85 40 L93 50 L150 50 C155 50, 158 53, 158 58 L158 102 C158 107, 155 110, 150 110 L50 110 C45 110, 42 107, 42 102 L42 48 C42 43, 45 40, 50 40 Z" 
        fill="rgba(30, 41, 59, 0.6)" stroke="url(#glowCyan)" stroke-width="2" filter="url(#softGlow)" />
        
  <!-- Paper slipping out of folder -->
  <rect x="60" y="32" width="80" height="50" rx="4" fill="rgba(255, 255, 255, 0.15)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" transform="rotate(-4 100 57)" />
  
  <!-- Abstract lines on paper -->
  <line x1="70" y1="42" x2="110" y2="42" stroke="rgba(255, 255, 255, 0.4)" stroke-width="3" stroke-linecap="round" transform="rotate(-4 100 57)" />
  <line x1="70" y1="52" x2="130" y2="52" stroke="rgba(255, 255, 255, 0.4)" stroke-width="3" stroke-linecap="round" transform="rotate(-4 100 57)" />
  <line x1="70" y1="62" x2="100" y2="62" stroke="rgba(255, 255, 255, 0.4)" stroke-width="3" stroke-linecap="round" transform="rotate(-4 100 57)" />

  <!-- Question Mark floating / glowing -->
  <circle cx="130" cy="40" r="14" fill="#1e1b4b" stroke="url(#glowPurple)" stroke-width="1.5" filter="url(#softGlow)" />
  <text x="130" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#f43f5e" text-anchor="middle">?</text>
  
  <!-- Mini sparkles -->
  <path d="M40 70 L42 74 L46 75 L42 76 L40 80 L38 76 L34 75 L38 74 Z" fill="#22c55e" opacity="0.8"/>
  <path d="M165 75 L167 78 L170 79 L167 80 L165 83 L163 80 L160 79 L163 78 Z" fill="#eab308" opacity="0.8"/>
</svg>
